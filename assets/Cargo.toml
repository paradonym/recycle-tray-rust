[package]
name = "recycle_tray"
version = "0.1.0"
edition = "2021"

[dependencies]
# Only PNG decoding is needed (replaces GDI+)
image = { version = "0.25", default-features = false, features = ["png"] }

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
winresource = "0.1"